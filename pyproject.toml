[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nepali-speech"
version = "0.1.0"
authors = [{name = "Abhiyan Sapkota"}]
description = "Nepali text preparation and local VITS speech synthesis"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = ["nepali-num2word==0.3.3", "g2p_en==2.1.0"]

[project.optional-dependencies]
indicxlit = ["ai4bharat-transliteration==1.1.3"]
tts = ["torch>=2.6", "huggingface_hub>=0.24", "soundfile>=0.12", "numpy>=1.24", "scipy>=1.10"]
dev = ["pytest>=8"]

[project.scripts]
nepali-speech = "nepali_speech.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: real model-backed preprocessing (opt-in)"]
